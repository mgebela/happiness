[build]
  command = "npm run build"
  publish = "dist"

# Far-future cache for static assets (YSlow C78 / Expires).
# HTML stays on Netlify's default max-age=0 so deploys show immediately.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Expires = "Thu, 31 Dec 2037 23:55:55 GMT"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Expires = "Thu, 31 Dec 2037 23:55:55 GMT"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Expires = "Thu, 31 Dec 2037 23:55:55 GMT"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Expires = "Thu, 31 Dec 2037 23:55:55 GMT"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/.well-known/ard.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Link = "</.well-known/ard.json>; rel=\"ard\""

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/organizacija"
  to = "/vjencanja"
  status = 301

[[redirects]]
  from = "/koordinacija"
  to = "/vjencanja"
  status = 301

[[redirects]]
  from = "/konzultacije"
  to = "/vjencanja"
  status = 301

[[redirects]]
  from = "/trenuci"
  to = "/"
  status = 301

[[redirects]]
  from = "/ai-catalog.json"
  to = "/.well-known/ard.json"
  status = 200

[[redirects]]
  from = "/.well-known/ai-catalog.json"
  to = "/.well-known/ard.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
